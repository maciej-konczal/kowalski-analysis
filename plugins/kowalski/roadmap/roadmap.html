<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap</title>
<style>
  :root {
    --bg: #f6f5f2; --glow: #e9e4ff; --panel: #ffffff; --raised: #ffffff; --ink: #18181b; --muted: #71717a; --faint: #a1a1aa;
    --line: #e4e4e7; --line-strong: #d4d4d8;
    --now: #2563eb; --next: #7c3aed; --later: #78716c; --done: #16a34a; --no: #dc2626; --warn: #d97706;
    --did: #0d9488; --said: #a1a1aa; --hi: #16a34a; --lo: #a1a1aa;
    --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0e; --glow: #1d1736; --panel: #131318; --raised: #1a1a21; --ink: #f4f4f5; --muted: #a1a1aa; --faint: #71717a;
      --line: #26262e; --line-strong: #34343e;
      --now: #60a5fa; --next: #a78bfa; --later: #a8a29e; --done: #4ade80; --no: #f87171; --warn: #fbbf24;
      --did: #2dd4bf; --said: #71717a; --hi: #4ade80; --lo: #71717a;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0e; --glow: #1d1736; --panel: #131318; --raised: #1a1a21; --ink: #f4f4f5; --muted: #a1a1aa; --faint: #71717a;
    --line: #26262e; --line-strong: #34343e;
    --now: #60a5fa; --next: #a78bfa; --later: #a8a29e; --done: #4ade80; --no: #f87171; --warn: #fbbf24;
    --did: #2dd4bf; --said: #71717a; --hi: #4ade80; --lo: #71717a;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: radial-gradient(1200px 500px at 15% -10%, var(--glow), transparent 70%), var(--bg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
  header { padding: 36px 0 20px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; margin: 4px 0 0; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; min-width: 84px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; }
  nav { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  nav button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .legend { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  main { padding-bottom: 56px; }

  .board { display: grid; gap: 14px; align-items: start; }
  .lane { min-width: 0; background: color-mix(in srgb, var(--panel) 70%, transparent); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-height: 120px; }
  .lane.is-empty { border-style: dashed; background: transparent; }
  .lane h2 { margin: 0 0 12px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .lane h2 .n { margin-left: auto; font-variant-numeric: tabular-nums; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 11px; color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .hint code { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }

  .card { position: relative; display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent, var(--later)); }
  .card:hover, .card:focus-visible { transform: translateY(-1px); border-color: var(--line-strong); outline: none; }
  .card:focus-visible { box-shadow: 0 0 0 2px var(--accent, var(--later)); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip.hi { color: var(--hi); border-color: color-mix(in srgb, var(--hi) 40%, transparent); background: color-mix(in srgb, var(--hi) 10%, transparent); }
  .chip.due { color: var(--no); border-color: color-mix(in srgb, var(--no) 45%, transparent); }
  .title { font-weight: 650; font-size: 15px; line-height: 1.35; letter-spacing: -.01em; }
  .detail { color: var(--muted); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .ev { display: inline-flex; gap: 3px; }
  .ev i { width: 7px; height: 7px; border-radius: 2px; background: var(--did); }
  .ev i.w { background: transparent; border: 1.5px solid var(--said); }
  .avatar { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--accent, var(--later)); color: var(--bg); }
  .test { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
  .test b { color: var(--ink); font-weight: 600; }

  .matrix { display: grid; grid-template-columns: 28px 1fr 1fr; grid-template-rows: 1fr 1fr 28px; gap: 14px; }
  .axis { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; display: grid; place-items: center; }
  .axis.y { grid-row: 1 / 3; writing-mode: vertical-rl; transform: rotate(180deg); }
  .axis.x { grid-column: 2 / 4; }
  .quad { border-radius: var(--radius); border: 1px solid var(--line); padding: 14px; min-height: 180px; background: color-mix(in srgb, var(--panel) 70%, transparent); }
  .quad h3 { margin: 0 0 2px; font-size: 14px; }
  .quad p { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .quad.best { background: color-mix(in srgb, var(--hi) 7%, var(--panel)); border-color: color-mix(in srgb, var(--hi) 35%, var(--line)); }
  .quad.drop { opacity: .75; }
  .aside { margin-top: 20px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .aside section { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: color-mix(in srgb, var(--panel) 70%, transparent); }
  .aside h3 { margin: 0 0 8px; font-size: 13px; }
  .aside li { margin-bottom: 4px; color: var(--muted); }
  @media (max-width: 760px) {
    .board { grid-template-columns: minmax(0, 1fr) !important; }
    .matrix { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
    .axis { display: none; }
    .stats { margin-left: 0; }
    h1 { font-size: 24px; }
  }

  #empty { text-align: center; padding: 80px 16px; color: var(--muted); }
  #empty h2 { color: var(--ink); font-size: 20px; margin: 0 0 8px; }

  dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--ink); padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 80px rgb(0 0 0 / .35); }
  dialog::backdrop { background: rgb(0 0 0 / .45); backdrop-filter: blur(3px); }
  .sheet { padding: 22px 24px 8px; }
  .sheet h2 { margin: 6px 0 4px; font-size: 21px; line-height: 1.3; letter-spacing: -.01em; }
  .sheet .lead { color: var(--muted); margin: 0 0 16px; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 18px; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .sheet h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .evlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .evlist li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--raised); }
  .evlist .k { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-right: 8px; }
  .evlist .k.behavior { color: var(--did); }
  .evlist .k.words { color: var(--muted); }
  .evlist .src { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .evlist a { color: var(--next); text-decoration: none; }
  .evlist a:hover { text-decoration: underline; }
  details { margin: 6px 0 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .hist { margin: 10px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
  .hist li { margin-bottom: 8px; }
  .hist pre { white-space: pre-wrap; font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; margin: 4px 0 0; }
  .close { position: sticky; bottom: 0; display: flex; justify-content: flex-end; padding: 12px 24px 18px; background: linear-gradient(transparent, var(--panel) 40%); }
  .close button { font: inherit; border: 1px solid var(--line); background: var(--raised); color: var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Roadmap</div>
      <h1 id="name">Roadmap</h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="bar">
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-view="board">Board</button>
      <button role="tab" aria-selected="false" data-view="grid">Impact vs effort</button>
    </nav>
    <div class="legend"><span><i style="background:var(--did);border-radius:2px"></i>evidence of what people do</span><span><i style="border:1.5px solid var(--said);border-radius:2px"></i>what people say</span></div>
  </div>
  <main>
    <div id="empty" hidden><h2>No bets yet</h2>Run <code>/kowalski:what-to-build</code> or <code>/kowalski:research</code> to map the first candidates.</div>
    <div id="board" class="board"></div>
    <div id="grid" hidden>
      <div class="matrix" id="matrix"></div>
      <div class="aside" id="aside"></div>
    </div>
  </main>
</div>
<dialog id="detail"><div class="sheet" id="sheet"></div><form method="dialog" class="close"><button autofocus>Close</button></form></dialog>
<script type="application/json" id="data">{{DATA}}</script>
<script>
  const data = JSON.parse(document.getElementById('data').textContent);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v; else n.setAttribute(k, v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) n.append(kid);
    return n;
  };
  const today = new Date().toISOString().slice(0, 10);
  const LANE = {
    now: { title: 'Now', color: 'var(--now)', hint: ['Building nothing. Start the first pick with ', '/kowalski:product-engineer', '.'] },
    next: { title: 'Next', color: 'var(--next)', hint: ['Nothing picked. Choose 1-3 with an owner and a test: ', '/kowalski:what-to-build', '.'] },
    later: { title: 'Later', color: 'var(--later)', hint: ['No candidates. Find some with ', '/kowalski:research', '.'] },
    done: { title: 'Done', color: 'var(--done)', hint: ['Nothing shipped yet.'] },
  };
  const ACCENT = { building: 'var(--now)', picked: 'var(--next)', candidate: 'var(--later)', shipped: 'var(--done)', kept: 'var(--done)', killed: 'var(--no)' };

  // "Short title: the detail" reads as a title and a line under it.
  const split = (what) => {
    const s = String(what || '');
    const i = s.indexOf(': ');
    if (!(i > 8 && i < 90)) return [s, ''];
    const rest = s.slice(i + 2);
    return [s.slice(0, i), rest[0].toUpperCase() + rest.slice(1)];
  };
  const evidence = (b) => b.evidence || [];
  const did = (b) => evidence(b).filter((e) => e.kind === 'behavior').length;
  const initials = (name) => String(name).split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  const pretty = (name) => /^[a-z0-9-]+$/.test(name) ? name.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ') : name;
  // Only http(s) sources become links; anything else stays plain text.
  const host = (src) => { try { const u = new URL(src); return /^https?:$/.test(u.protocol) ? u.hostname.replace(/^www\./, '') : null; } catch { return null; } };

  function chips(b) {
    const out = [];
    if (b.for) out.push(el('span', { class: 'chip' }, b.for));
    if (b.impact) out.push(el('span', { class: 'chip' + (b.impact === 'high' ? ' hi' : '') }, b.impact + ' impact'));
    if (b.effort) out.push(el('span', { class: 'chip' + (b.effort === 'low' ? ' hi' : '') }, b.effort + ' effort'));
    if (b.by) out.push(el('span', { class: 'chip' + (b.by < today && ['picked', 'building'].includes(b.status) ? ' due' : '') }, 'by ' + b.by));
    if (b.status === 'killed') out.push(el('span', { class: 'chip due' }, 'killed'));
    if (b.status === 'kept') out.push(el('span', { class: 'chip hi' }, 'kept'));
    return out.length ? el('div', { class: 'chips' }, out) : null;
  }

  function card(b, compact) {
    const [title, detail] = split(b.what);
    const ev = evidence(b);
    const d = did(b);
    const c = el('button', { class: 'card', type: 'button', style: '--accent:' + (ACCENT[b.status] || 'var(--later)') },
      compact ? null : chips(b),
      el('div', { class: 'title' }, title),
      detail && !compact ? el('div', { class: 'detail' }, detail) : null,
      el('div', { class: 'foot' },
        ev.length ? el('span', { class: 'ev', title: d + ' about what people do, ' + (ev.length - d) + ' about what they say' },
          ev.map((e) => el('i', { class: e.kind === 'behavior' ? '' : 'w' }))) : null,
        data.shared ? null : el('span', {}, ev.length ? (d ? d + ' did' : '') + (d && ev.length - d ? ' · ' : '') + (ev.length - d ? (ev.length - d) + ' said' : '') : 'no evidence yet'),
        b.ref ? el('span', {}, b.ref) : null,
        b.owner ? el('span', { class: 'avatar', title: 'owner ' + b.owner }, initials(b.owner)) : null),
      b.test && !compact ? el('div', { class: 'test' }, el('b', {}, 'Test '), b.test, b.drop_if ? ' · drop if ' + b.drop_if : '') : null);
    c.addEventListener('click', () => open(b));
    return c;
  }

  function lane(key, bets) {
    const L = LANE[key];
    const s = el('section', { class: 'lane' + (bets.length ? '' : ' is-empty') },
      el('h2', {}, el('span', { class: 'dot', style: 'background:' + L.color }), L.title, el('span', { class: 'n' }, String(bets.length))));
    if (!bets.length && !data.shared) s.append(el('div', { class: 'hint' }, L.hint.map((t, i) => i === 1 ? el('code', {}, t) : t)));
    bets.forEach((b) => s.append(card(b)));
    return s;
  }

  function open(b) {
    const [title, detail] = split(b.what);
    const facts = [['Status', b.status], ['For', b.for], ['Owner', b.owner], ['Impact', b.impact], ['Effort', b.effort], ['Reuses', b.reuses],
      ['Test', b.test], ['Drop if', b.drop_if], ['By', b.by], ['Tracker', b.ref], ['Signal', b.signal], ['Outcome', b.outcome], ['Principle', b.principle]]
      .filter(([, v]) => v);
    const sheet = document.getElementById('sheet');
    sheet.replaceChildren(...[
      el('div', { class: 'eyebrow' }, b.id),
      el('h2', {}, title),
      detail ? el('p', { class: 'lead' }, detail) : null,
      el('dl', { class: 'facts' }, facts.map(([k, v]) => [el('dt', {}, k), el('dd', {}, String(v))])),
      b.brief ? [el('h3', {}, 'Brief'), el('dl', { class: 'facts' }, Object.entries(b.brief).map(([k, v]) => [el('dt', {}, k.replace('_', ' ')), el('dd', {}, v)]))] : null,
      data.shared ? null : el('h3', {}, 'Evidence'),
      data.shared ? null : evidence(b).length ? el('ul', { class: 'evlist' }, evidence(b).map((e) => el('li', {},
        el('span', { class: 'k ' + e.kind }, e.kind === 'behavior' ? 'did' : 'said'), e.says,
        el('span', { class: 'src' },
          host(e.source) ? el('a', { href: e.source, target: '_blank', rel: 'noopener noreferrer' }, host(e.source)) : e.source,
          ' · ' + e.date + ' · ' + ({ V: 'verified', S: 'read', U: 'unverified' }[e.mark] || e.mark)))))
        : el('p', { class: 'hint' }, 'No evidence recorded.'),
      data.shared ? null : el('details', {}, el('summary', {}, 'History (' + (data.history[b.id] || []).length + ((data.history[b.id] || []).length === 1 ? ' line)' : ' lines)')),
        el('ol', { class: 'hist' }, (data.history[b.id] || []).map((line) => el('li', {}, el('strong', {}, line.at + ' ' + line.status),
          el('pre', {}, Object.entries(line).filter(([k]) => !['id', 'at', 'status', 'evidence', 'what'].includes(k))
            .map(([k, v]) => k + ': ' + (typeof v === 'string' ? v : JSON.stringify(v))).join('\n'))))))].flat(Infinity).filter((x) => x != null));
    document.getElementById('detail').showModal();
  }

  const c = data.columns;
  if (data.shared) document.querySelector('.legend').hidden = true;
  const name = data.name ? pretty(data.name) : 'Roadmap';
  document.getElementById('name').textContent = name;
  document.title = name + ' · Roadmap';
  const all = [...c.now, ...c.next, ...c.later, ...c.done];
  const evAll = all.flatMap(evidence);
  const stat = (n, label, color) => el('div', { class: 'stat' }, el('b', { style: color ? 'color:' + color : '' }, String(n)), el('span', {}, label));
  document.getElementById('stats').append(
    stat(c.now.length, 'Now', 'var(--now)'), stat(c.next.length, 'Next', 'var(--next)'), stat(c.later.length, 'Later'),
    stat(c.done.length, 'Done', 'var(--done)'), data.shared ? '' : stat(evAll.filter((e) => e.kind === 'behavior').length + ' of ' + evAll.length, 'evidence is behavior'));

  const board = document.getElementById('board');
  if (!data.total) { document.getElementById('empty').hidden = false; board.hidden = true; }
  const keys = ['now', 'next', 'later', 'done'];
  board.style.gridTemplateColumns = keys.map((k) => c[k].length ? 'minmax(0, 2fr)' : 'minmax(150px, 1fr)').join(' ');
  board.append(...keys.map((k) => lane(k, c[k])));

  const Q = [['high-low', 'Do first', 'High impact, low effort', 'best'], ['high-high', 'Test first', 'High impact, high effort: a cheap test in front'],
             ['low-low', 'Maybe', 'Low impact, low effort'], ['low-high', 'Say no', 'Low impact, high effort', 'drop']];
  const matrix = document.getElementById('matrix');
  matrix.append(el('div', { class: 'axis y' }, 'Impact'));
  for (const [key, title, sub, cls] of Q) {
    matrix.append(el('section', { class: 'quad ' + (cls || '') }, el('h3', {}, title, ' ', el('span', { class: 'chip' }, String(data.grid[key].length))), el('p', {}, sub),
      data.grid[key].map((b) => card(b, true))));
  }
  matrix.append(el('div', { class: 'axis x' }, 'Effort'));
  const aside = document.getElementById('aside');
  if (data.unscored.length) aside.append(el('section', {}, el('h3', {}, 'Unscored: no impact or effort yet'), el('ul', {}, data.unscored.map((b) => el('li', {}, split(b.what)[0] + ' (' + b.status + ')')))));
  if (data.saidNo.length) aside.append(el('section', {}, el('h3', {}, 'Said no'), el('ul', {}, data.saidNo.map((b) => el('li', {}, split(b.what)[0] + ': no, by ' + (b.principle || '?'))))));

  const linked = all.find((b) => '#' + b.id === location.hash);
  if (linked) open(linked);
  if (location.hash === '#grid') queueMicrotask(() => document.querySelector('nav [data-view="grid"]').click());

  document.querySelectorAll('nav button').forEach((btn) => btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-selected', String(x === btn)));
    const grid = btn.dataset.view === 'grid';
    document.getElementById('grid').hidden = !grid;
    board.hidden = grid || !data.total;
  }));
</script>
</body>
</html>
