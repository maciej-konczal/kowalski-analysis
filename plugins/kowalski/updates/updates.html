<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the vision and a progress bar toward its end state, then day by day: a calendar to pick any day and columns for the day before, the day and the day after. A product overrides the look with .product/page.css (appended below). */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #dde1e7; --line-strong: #c3c9d2;
  --accent: #2554c7; --accent-ink: #ffffff; --soft: #e6ecfa; --due: #a35c00; --good: #2f7d32;
  --display: ui-monospace, "SF Mono", Menlo, monospace; --sans: system-ui, "Segoe UI", sans-serif; --mono: ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --panel: #161b22; --ink: #e8ecf1; --muted: #9aa4b2; --line: #262d37; --line-strong: #3a4350;
  --accent: #8fb0ff; --accent-ink: #0f1216; --soft: #1b2638; --due: #f0b35e; --good: #7cc87f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #161b22; --ink: #e8ecf1; --muted: #9aa4b2; --line: #262d37; --line-strong: #3a4350;
  --accent: #8fb0ff; --accent-ink: #0f1216; --soft: #1b2638; --due: #f0b35e; --good: #7cc87f; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 36px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 32px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font: 500 12px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(28px, 4.6vw, 42px)/1.1 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font: 400 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
header { display: grid; gap: 14px; }
.vision p { margin: 0 0 10px; font-size: 17px; max-width: 70ch; }

/* progress toward the end state */
.progress { display: grid; gap: 12px; }
.bar { position: relative; height: 14px; background: var(--line); }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bar-head b { font: 700 22px var(--display); }
.bar-head span { color: var(--muted); font-size: 13px; }
.steps { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.step { background: var(--panel); padding: 10px 12px; display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
.st { font: 400 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--line-strong); color: var(--muted); justify-self: start; }
.step.done .st { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step.partial .st { color: var(--accent); border-color: var(--accent); }
.step .what { font-weight: 600; }
.step .now { grid-column: 2; color: var(--muted); font-size: 13px; }
.step .now a { font-family: var(--mono); font-size: 12px; }

/* day by day */
.navrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.btn { background: transparent; border: 1px solid var(--line-strong); color: var(--ink); font: 400 13px var(--mono); padding: 6px 12px; cursor: pointer; }
.btn:hover { background: var(--panel); }
input[type=date] { background: var(--panel); border: 1px solid var(--line-strong); color: var(--ink); font: 400 13px var(--mono); padding: 5px 8px; }
.legend { color: var(--muted); font-size: 12px; margin-left: auto; }
.cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; }
.day { background: var(--panel); border: 1px solid var(--line); color: var(--ink); font: 400 12px var(--mono); padding: 6px 2px 8px; display: grid; justify-items: center; gap: 4px; cursor: pointer; }
.day:hover { border-color: var(--line-strong); }
.day .m { font-size: 10px; color: var(--muted); line-height: 1; } .day .n { line-height: 1; }
.day .b { width: 70%; height: 4px; background: var(--line); } .day .b i { display: block; height: 100%; background: var(--accent); }
.day.plan .b { background: transparent; outline: 1px solid var(--due); }
.day.today { border-color: var(--due); }
.day.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day.sel .m { color: var(--accent-ink); }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 16px; }
.col { background: var(--bg); padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.col.focus { background: var(--panel); }
.rel { font: 700 12px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
.date { font: 700 20px var(--display); }
.sect { display: grid; gap: 8px; }
.sect > b { font: 400 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 14.5px; }
.tag { font: 400 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 0 5px; }
.item a { font: 400 12px var(--mono); }
.none { color: var(--muted); font-size: 13px; font-style: italic; }
details { font-size: 12.5px; color: var(--muted); }
summary { cursor: pointer; font: 400 12px var(--mono); color: var(--accent); }
details ul { margin: 8px 0 0; padding-left: 16px; display: grid; gap: 4px; }
details.more summary { list-style: none; color: inherit; font: inherit; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary .t::after { content: "  +"; color: var(--accent); font-family: var(--mono); }
details.more[open] summary .t::after { content: "  -"; }
details.more ul { color: var(--ink); font-size: 13px; }
footer { color: var(--muted); font-size: 12px; }
@media (max-width: 820px) { .legend { margin-left: 0; width: 100%; } .step { grid-template-columns: minmax(0, 1fr); } .step .now { grid-column: 1; } }
</style>
<style>{{CSS}}</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Product updates</div>
    <h1 id="title"></h1>
    <div class="vision" id="vision"></div>
  </header>

  <section class="progress" id="progress" aria-labelledby="progress-h" hidden>
    <h2 id="progress-h">Toward the end state</h2>
    <div class="bar-head"><b id="pct"></b><span id="pct-note"></span></div>
    <div class="bar" role="progressbar" aria-labelledby="progress-h" id="bar"><i></i></div>
    <div class="steps" id="steps"></div>
  </section>

  <section aria-labelledby="days-h">
    <h2 id="days-h">Day by day</h2>
    <div class="navrow">
      <button class="btn" id="prev" type="button" aria-label="Previous day">&larr;</button>
      <input type="date" id="pick" aria-label="Choose a day">
      <button class="btn" id="next" type="button" aria-label="Next day">&rarr;</button>
      <button class="btn" id="today" type="button">Today</button>
      <button class="btn" id="earlier" type="button">+ earlier day</button>
      <button class="btn" id="reset" type="button" hidden>Reset</button>
      <span class="legend">Bar = how much changed that day · outline = something planned</span>
    </div>
    <div class="cal" id="cal" role="list"></div>
    <div class="days" id="days"></div>
  </section>

  <footer>Added: each day's highlights in plain words, with every change from git underneath. Planned: what is due that day.</footer>
</div>

<script>
const DATA = {{DATA}};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const parse = s => new Date(s + "T12:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const add = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const localToday = (() => { const d = new Date(); return iso(new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 12))); })();
const known = [...Object.keys(DATA.changes), ...Object.keys(DATA.updates), DATA.today].sort();
const FIRST = known[0], LAST = [known[known.length - 1], add(DATA.today, 14)].sort().pop();
const clamp = s => s < FIRST ? FIRST : s > LAST ? LAST : s;
const fmt = s => parse(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
const rel = s => s === localToday ? "Today" : s === add(localToday, -1) ? "Yesterday" : s === add(localToday, 1) ? "Tomorrow" : parse(s).toLocaleDateString("en-GB", { weekday: "long", timeZone: "UTC" });

// vision and progress
const V = DATA.vision;
document.getElementById("title").textContent = V.title || "Product updates";
document.getElementById("vision").innerHTML = (V.paragraphs || []).map(p => "<p>" + esc(p) + "</p>").join("");
if (V.steps && V.steps.length) {
  document.getElementById("progress").hidden = false;
  document.getElementById("pct").textContent = V.progress + "%";
  const n = k => V.steps.filter(s => s.status === k).length;
  document.getElementById("pct-note").textContent = n("done") + " done · " + n("partial") + " partly there · " + n("next") + " not started (partly counts as half)";
  document.getElementById("bar").setAttribute("aria-valuenow", V.progress);
  document.querySelector("#bar i").style.width = V.progress + "%";
  const label = { done: "done", partial: "partly", next: "not yet" };
  const refLink = r => /^https?:\/\//.test(r) ? '<a href="' + esc(r) + '" target="_blank" rel="noopener">link</a>' : (DATA.refUrl && r ? '<a href="' + esc(DATA.refUrl + r) + '" target="_blank" rel="noopener">' + esc(r) + "</a>" : esc(r));
  document.getElementById("steps").innerHTML = V.steps.map(s => '<div class="step ' + s.status + '"><span class="st">' + label[s.status] + '</span><span class="what">' + esc(s.what) + "</span>" +
    (s.now || s.ref ? '<span class="now">' + esc(s.now) + (s.ref ? " " + refLink(s.ref) : "") + "</span>" : "") + "</div>").join("");
}

// day by day
const days = []; for (let s = FIRST; s <= LAST; s = add(s, 1)) days.push(s);
const count = s => (DATA.changes[s] || []).length;
const max = Math.max(1, ...days.map(count));
let sel = clamp(localToday), back = 1;
try { const saved = localStorage.getItem("updates-day"); if (saved && saved >= FIRST && saved <= LAST) sel = saved; } catch (e) {}
const pick = document.getElementById("pick"); pick.min = FIRST; pick.max = LAST;

function itemHTML(it) {
  const link = it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.ref || "link") + "</a>" : (it.ref ? '<span class="tag">' + esc(it.ref) + "</span>" : "");
  const head = (it.tag ? '<span class="tag">' + esc(it.tag) + "</span>" : "") + '<span class="t">' + esc(it.text) + "</span>" + link;
  if (!it.details || !it.details.length) return '<div class="item">' + head + "</div>";
  return '<details class="more"><summary><span class="item">' + head + "</span></summary><ul>" + it.details.map(d => "<li>" + esc(d) + "</li>").join("") + "</ul></details>";
}
function colHTML(s, focus) {
  const u = DATA.updates[s] || {}, added = u.added || [], planned = u.planned || [], all = DATA.changes[s] || [];
  let h = '<div class="col' + (focus ? " focus" : "") + '"><div><div class="rel">' + rel(s) + '</div><div class="date">' + fmt(s) + "</div></div>";
  h += '<div class="sect"><b>Added</b>' + (added.length ? added.map(itemHTML).join("") : '<span class="none">' + (s > localToday ? "Not yet" : all.length ? "Changes below, no summary yet" : "Nothing shipped") + "</span>") + "</div>";
  if (all.length) h += "<details><summary>All " + all.length + " changes</summary><ul>" + all.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></details>";
  if (planned.length) h += '<div class="sect"><b>Planned</b>' + planned.map(itemHTML).join("") + "</div>";
  return h + "</div>";
}
function render() {
  pick.value = sel;
  try { localStorage.setItem("updates-day", sel); } catch (e) {}
  document.getElementById("cal").innerHTML = days.map(s => {
    const d = parse(s), plan = (DATA.updates[s]?.planned || []).length;
    return '<button type="button" role="listitem" class="day' + (s === sel ? " sel" : "") + (s === localToday ? " today" : "") + (plan ? " plan" : "") + '" data-d="' + s + '" aria-label="' + fmt(s) + ", " + count(s) + ' changes"><span class="n">' + d.getUTCDate() +
      '</span><span class="m">' + d.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" }) + '</span><span class="b"><i style="width:' + Math.round(count(s) / max * 100) + '%"></i></span></button>';
  }).join("");
  const offs = []; for (let o = -back; o <= 1; o++) { const s = add(sel, o); if (s >= FIRST && s <= LAST) offs.push(o); }
  document.getElementById("days").innerHTML = offs.map(o => colHTML(add(sel, o), o === 0)).join("");
  document.getElementById("reset").hidden = back === 1;
}
document.getElementById("cal").addEventListener("click", e => { const b = e.target.closest(".day"); if (b) { sel = b.dataset.d; render(); } });
document.getElementById("prev").onclick = () => { sel = clamp(add(sel, -1)); render(); };
document.getElementById("next").onclick = () => { sel = clamp(add(sel, 1)); render(); };
document.getElementById("today").onclick = () => { sel = clamp(localToday); render(); };
document.getElementById("earlier").onclick = () => { back += 1; render(); };
document.getElementById("reset").onclick = () => { back = 1; render(); };
pick.addEventListener("change", () => { if (pick.value) { sel = clamp(pick.value); render(); } });
render();
</script>
